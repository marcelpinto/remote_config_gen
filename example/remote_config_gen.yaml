# Example configuration for remote_config_gen
# This file defines the input JSON file location and output directory
input: remoteconfig.template.json
output: lib/generated
defaults:
  feature_enabled: true
  feature_flags:
    new_onboarding: true
converters:
  theme_config:
    type: ThemeConfig
    converter: ThemeConfigConverter
    import: package:example/models/theme_config_converter.dart
